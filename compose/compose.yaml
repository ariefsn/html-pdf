version: '3'

name: html-pdf

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=${PORT}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - QUEUE_URL=${QUEUE_URL}
      # :- so an absent or empty value in .env falls back here. A bare
      # ${QUEUE_SUBJECT} would pass an empty string, which overrides the
      # app's own default and makes publishing fail with BAD_SUBJECT.
      - QUEUE_SUBJECT=${QUEUE_SUBJECT:-generate.pdf}
      - QUEUE_SUBSCRIBE=${QUEUE_SUBSCRIBE:-generate.>}
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    ports:
      - "${PORT}:${PORT}"
    restart: always
    networks:
      - html-pdf-network

  nats:
    image: nats
    container_name: nats
    mem_limit: 50m
    restart: always
    networks:
      - html-pdf-network

networks:
  html-pdf-network:
